<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SaaS Product Investigator">
  <!--
    Deliberately heavy strokes and only two shapes: a favicon is read at 16px, where a thin outline
    or a third detail turns into grey mush. The teal is --primary from the light palette, which reads
    acceptably against both light and dark browser chrome.
  -->
  <rect width="32" height="32" rx="7" fill="#2F9E8F" />
  <circle cx="14.5" cy="14.5" r="6" fill="none" stroke="#FFFFFF" stroke-width="3" />
  <path d="M19 19l5.5 5.5" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
</svg>
