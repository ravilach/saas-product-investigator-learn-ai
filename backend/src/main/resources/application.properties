spring.application.name=saas-product-investigator

# Spring Security's default in-memory user is not used - authentication is by JWT
# against the users collection, and no UserDetailsService is involved. Left on, it
# logs a "Using generated security password" warning on every boot that looks like
# a real credential and is not one.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# Cross-origin callers allowed to reach /api/**. Only relevant in local
# development, where Vite serves the frontend on its own port; in the packaged
# image the frontend and API share an origin and this does nothing. Defaults to
# the Vite dev server rather than a wildcard.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ---------------------------------------------------------------------------
# MongoDB
#
# MONGODB_URI cannot be resolved through the Admin Console - the Admin Console's
# ability to store anything already depends on this connection existing. In
# Docker, entrypoint.sh starts a local mongod and exports this when it is unset;
# for local development you are expected to set it yourself. The localhost
# default below just makes `mvn spring-boot:run` work against a plain
# `docker compose up mongo` without extra ceremony.
#
# The property is `spring.mongodb.uri`, NOT `spring.data.mongodb.uri`. Boot 4.0
# split connection configuration out of the Spring Data namespace and removed the
# old name at deprecation level `error`, which means it is not bound and not
# warned about - it is silently ignored, and the connection falls back to Boot's
# default of mongodb://localhost/test. The failure mode is the worst kind: the app
# boots, every query works, and the data is in a database nobody configured. Do
# not "fix" this back to the older name because an example on the internet uses
# it. `spring.data.mongodb.auto-index-creation` below is a genuine Spring Data
# property and correctly keeps that prefix; indexes are created explicitly by
# MongoIndexInitializer rather than derived from annotations.
# ---------------------------------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/saas-investigator}
spring.data.mongodb.auto-index-creation=false

# ---------------------------------------------------------------------------
# Secrets / credentials
#
# CREDENTIAL_ENCRYPTION_KEY is the root of trust that encrypts everything else
# this app stores (LLM API keys, MCP auth tokens, the persisted JWT secret), so
# it cannot itself be stored encrypted in Mongo. Outside Docker it must be set
# explicitly; inside Docker, entrypoint.sh generates one into /data when unset.
# ---------------------------------------------------------------------------
app.credential-encryption-key=${CREDENTIAL_ENCRYPTION_KEY:}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}

# Optional quick-boot convenience: a plain-text Anthropic key bind-mounted from
# the host. Set IGNORE_HOST_CREDENTIALS=true to skip it even when present.
app.host-credentials.anthropic-key-path=${HOST_CREDENTIAL_ANTHROPIC_PATH:/run/host-credentials/anthropic-api-key}
app.host-credentials.ignore=${IGNORE_HOST_CREDENTIALS:false}

# ---------------------------------------------------------------------------
# LLM providers (server-side only - never exposed to the frontend)
#
# Both defaults are the current generation as of this build, verified against the
# model IDs the pinned SDKs ship (anthropic-java 2.64.0, openai-java 4.65.0) and
# against each provider's live model documentation. The build prompt named
# claude-sonnet-4-6 and "OpenAI's current flagship"; claude-sonnet-5 is the same
# tier one generation on, and gpt-6-astra is what OpenAI's docs now call the
# flagship. Both are plain env-var overrides precisely because model names move
# faster than this repo does - see docs/decisions/0007-llm-providers.md.
# ---------------------------------------------------------------------------
app.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.llm.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}
app.llm.openai.api-key=${OPENAI_API_KEY:}
app.llm.openai.model=${OPENAI_MODEL:gpt-6-astra}

# Where to send those calls. Blank means the provider's own API, which is what almost
# every instance wants; both SDKs already default there. Set one of these to put an
# OpenAI- or Anthropic-compatible endpoint in between: an LLM gateway that centralises
# keys and spend, a corporate egress proxy that terminates outbound TLS, a regional or
# self-hosted deployment of the same API, or a local stub when you want to exercise this
# application's run pipeline end to end without spending money on a model.
#
# Deliberately a URL and nothing else. This is not a second provider abstraction: the
# endpoint has to speak the same API the pinned SDK speaks, because the request built
# for it is unchanged. Point it at something that doesn't and the failure is the usual
# provider error, surfaced the usual way.
app.llm.anthropic.base-url=${ANTHROPIC_BASE_URL:}
app.llm.openai.base-url=${OPENAI_BASE_URL:}

# Total source-text budget for one prompt, across every block in it - not a model
# context limit but a cost and signal-to-noise limit, since a prompt mostly filled
# with navigation chrome is not analysis. Divided between sources, so twenty sources
# each get a twentieth. Declared here rather than left to its code default because a
# knob nobody can find is not a knob. LlmProperties clamps anything below 20,000.
app.llm.max-prompt-chars=${LLM_MAX_PROMPT_CHARS:600000}

# Output token budgets per analysis depth live on the AnalysisDepth enum, not here.
# The budget and the depth's prompt instruction have to change together - NUCLEAR asking
# for exhaustive detail with a SHORT budget is a truncated report - so they are one
# declaration rather than two that can drift.

# ---------------------------------------------------------------------------
# Crawler
#
# The first two are defaults, overridable at runtime from Admin Console -> Settings
# (persisted in system_config) and per source. The max-allowed-* pair are ceilings
# that nothing can raise: crawling is a safety boundary, and a boundary an admin can
# type past in a form field is not one. See CrawlSettings and /docs/ARCHITECTURE.md.
# ---------------------------------------------------------------------------
app.crawler.default-max-depth=2
app.crawler.default-max-pages=20
app.crawler.max-allowed-depth=5
app.crawler.max-allowed-pages=200
app.crawler.per-page-timeout-ms=10000
app.crawler.connect-timeout-ms=5000
app.crawler.max-bytes-per-page=5242880
app.crawler.max-chars-per-source=200000
app.crawler.concurrency=4

# Ceiling on an honoured robots.txt Crawl-delay. The delay is respected, but a site
# publishing 300 seconds times a 20-page budget is a run that looks hung for an hour,
# so it is clamped and the clamp is logged.
app.crawler.max-crawl-delay-ms=2000

# Sent on every request, and the product token before the "/" is what is matched
# against robots.txt User-agent lines. The URL makes us identifiable to whoever reads
# their access logs and wonders who this is.
app.crawler.user-agent=SaaSProductInvestigator/0.1 (+https://github.com/ravilach/saas-product-investigator-learn-ai)

# ---------------------------------------------------------------------------
# Run execution
#
# Two separate pools, on purpose. A run crawls somebody else's website and calls a
# metered API; a question is a single short model call somebody typed into a query
# bar and is waiting on. Sharing one pool would let three nuclear-depth runs make
# the query bar stop responding, so they cannot.
#
# The queue is deliberately short. Past it, a run is rejected with a 503 saying to
# try again - which is a better answer than a runId for a run that will not start
# for half an hour, because the resource being protected is a third party's server
# and a paid API, not this process's CPU. See RunExecutor.
# ---------------------------------------------------------------------------
app.run.concurrency=${RUN_CONCURRENCY:3}
app.run.queue-capacity=${RUN_QUEUE_CAPACITY:12}
app.run.ask-concurrency=${ASK_CONCURRENCY:6}

# ---------------------------------------------------------------------------
# Observability: only health + prometheus are exposed. /actuator/** is
# permitted without a JWT on purpose (scrapers do not authenticate) - restrict
# it at the network/ingress layer. See SecurityConfig and /docs/DEPLOYMENT.md.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# The key below is the Micrometer meter name (saas.run.duration), NOT the series
# Prometheus publishes (saas_run_duration_seconds). These filters are matched
# against meter names by walking prefixes - saas.run.duration, then saas.run, then
# saas - so a key of "saas.run.duration.seconds" matches no meter and does
# nothing. It is not rejected and not warned about; the timer simply keeps
# publishing as a summary with _count/_sum/_max and no _bucket series, so
# histogram_quantile() over run latency silently returns nothing. This repo
# shipped exactly that until step 12. RunMetrics' Javadoc explains why the _seconds
# suffix appears in the published name and not here.
management.metrics.distribution.percentiles-histogram.saas.run.duration=true

# Bounds on that histogram's buckets, and they are load-bearing rather than
# tuning. Micrometer's default range for a percentile histogram is roughly 1ms to
# 30s, which is sized for HTTP requests; a run crawls several sites and waits on a
# model API, so essentially every real run would land in the top bucket and every
# quantile would read as "30 seconds or more". Bounding it to 1s-15m spends the
# same number of series on the range runs actually occupy. 15m is above the 10m
# spring.mvc.async.request-timeout that caps how long a client can watch a run,
# since the run itself outlives a disconnected viewer.
management.metrics.distribution.minimum-expected-value.saas.run.duration=1s
management.metrics.distribution.maximum-expected-value.saas.run.duration=15m

# ---------------------------------------------------------------------------
# API docs at /swagger-ui.html
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# SSE responses must not be buffered or gzipped, or progress events arrive in
# one burst at the end instead of as they happen.
# ---------------------------------------------------------------------------
server.compression.enabled=false
spring.mvc.async.request-timeout=600000

logging.level.com.saasinvestigator=INFO
