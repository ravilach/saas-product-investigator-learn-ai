# PLACEHOLDER VALUES - do not apply this file as-is.
#
# Every value below is a placeholder written in `stringData`, which Kubernetes
# base64-encodes for you on apply. That is deliberate for a sample you are meant
# to read; note that `stringData` means the real values would sit in plaintext in
# whatever you commit, so for anything but a scratch cluster generate the Secret
# instead of checking one in:
#
#   kubectl create secret generic saas-investigator-secrets \
#     --from-literal=MONGODB_URI='mongodb://user:pass@mongo-0.mongo:27017/saas-investigator?replicaSet=rs0' \
#     --from-literal=CREDENTIAL_ENCRYPTION_KEY="$(head -c 32 /dev/urandom | base64)" \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...'
#
# ...or point External Secrets Operator / Secrets Store CSI / Sealed Secrets at
# your real secret manager. A Kubernetes Secret is base64, not encryption; it is
# worth having as a separate object because it can be separately RBAC-restricted
# and audited, not because the contents are protected.
apiVersion: v1
kind: Secret
metadata:
  name: saas-investigator-secrets
  labels:
    app.kubernetes.io/name: saas-investigator
type: Opaque
stringData:
  # ---------------------------------------------------------------------------
  # Required in a cluster. Both of these have container-local fallbacks (see
  # docs/SETUP.md) and both fallbacks are wrong here: unset, each pod would start
  # its own embedded mongod and generate its own encryption key, so two replicas
  # would be two disconnected applications that cannot read each other's data.
  # ---------------------------------------------------------------------------

  # PLACEHOLDER. Any MongoDB the pods can reach - a managed Atlas cluster, an
  # operator-managed replica set, a StatefulSet you run yourself. Deliberately not
  # shipped as part of these manifests: running a database is a decision with an
  # owner, and a sample StatefulSet with no backups is worse than no sample.
  MONGODB_URI: "mongodb://CHANGEME-mongo-host:27017/saas-investigator"

  # PLACEHOLDER. Generate with: head -c 32 /dev/urandom | base64
  #
  # The master key for everything encrypted at rest - LLM API keys, MCP auth
  # tokens, the persisted JWT signing secret. Change it and every value already
  # encrypted under the old one becomes permanently unreadable, silently:
  # undecryptable values are treated as unset, so the symptom is "our saved
  # Anthropic key vanished", not a crash. Back it up wherever you back up
  # database credentials, and see the rotate-secrets skill before changing it -
  # rotation means re-encrypting existing values first, not swapping this string.
  CREDENTIAL_ENCRYPTION_KEY: "CHANGEME-base64-32-bytes"

  # ---------------------------------------------------------------------------
  # Optional
  # ---------------------------------------------------------------------------

  # PLACEHOLDER. Applies to every user's runs. Can equally be set (and outranked)
  # from Admin Console -> Secrets after boot, which is the path that does not need
  # a redeploy; the override wins over this value on purpose. Users may also bring
  # their own key in Account Settings, spent on their own quota.
  ANTHROPIC_API_KEY: "sk-ant-CHANGEME"

  # PLACEHOLDER. Only needed if anyone will pick OpenAI as their provider.
  # OPENAI_API_KEY: "sk-CHANGEME"

  # JWT_SECRET is intentionally commented out, and leaving it that way is the
  # better default even in a cluster. Unset, the app generates a 256-bit secret on
  # first boot, encrypts it under CREDENTIAL_ENCRYPTION_KEY, and persists it in
  # the database - so every replica resolves the same secret and a rollout does
  # not sign anyone out. Set it here and you get one more secret to manage for no
  # gain, plus a rollout that invalidates every session the moment the value
  # changes. Set it only if an external system must mint tokens this app accepts.
  # JWT_SECRET: "CHANGEME-at-least-32-characters-long"
